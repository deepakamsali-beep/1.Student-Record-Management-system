<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Record Management System</h1>
            <p>Manage student records easily</p>
        </header>

        <!-- Student Form -->
        <section class="form-section">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo" placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter course" required>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>

                <div class="button-group">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">
                        Cancel
                    </button>
                </div>

            </form>
        </section>

        <!-- Search -->
        <section class="search-section">
            <h2>Search Student</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="searchRoll"
                    placeholder="Enter roll number to search..."
                >
                <button onclick="searchStudent()">Search</button>
                <button onclick="displayStudents()" class="show-all">
                    Show All
                </button>
            </div>
        </section>

        <!-- Student Records -->
        <section class="records-section">

            <h2>Student Records</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Year</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <!-- Student records will appear here -->
                    </tbody>
                </table>
            </div>

            <p id="noRecords" class="no-records">
                No student records found.
            </p>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
